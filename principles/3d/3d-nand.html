<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D NAND 存储塔 · 3D 交互</title>
<style>
  :root{
    --ink:#e8f0f8; --ink-dim:#9db4cc; --line:rgba(150,180,215,.55);
    --panel:rgba(13,20,32,.55); --panel-border:rgba(140,170,210,.16);
    --accent:#8fbdf0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0d1420;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;}
  #stage{position:fixed;inset:0;display:block;cursor:grab;}
  #stage.dragging{cursor:grabbing;}
  #vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 120% 90% at 50% 42%, transparent 55%, rgba(4,8,14,.55) 100%);}
  #wires{position:fixed;inset:0;pointer-events:none;z-index:5;}
  /* 顶部标题 */
  #hdr{position:fixed;top:26px;left:34px;z-index:10;pointer-events:none;}
  #hdr h1{font-size:21px;font-weight:700;letter-spacing:.06em;color:var(--ink);}
  #hdr h1 .en{font-size:11px;font-weight:500;letter-spacing:.18em;color:var(--ink-dim);margin-left:10px;text-transform:uppercase;}
  #hdr p{margin-top:8px;font-size:13px;letter-spacing:.05em;color:var(--ink-dim);}
  #hdr p b{color:var(--accent);font-weight:600;}
  #caption{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:9;
    font-size:12.5px;letter-spacing:.06em;color:var(--ink-dim);pointer-events:none;
    transition:opacity .4s;white-space:nowrap;}
  #caption b{color:var(--accent);font-weight:600;}
  /* 底部控制簇 */
  #ctrls{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:10;
    display:flex;flex-direction:column;align-items:center;gap:10px;}
  #ctrls .row{display:flex;gap:10px;align-items:center;}
  .pill{padding:11px 24px;border-radius:999px;border:1px solid var(--panel-border);
    background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    color:var(--ink);font-size:13px;letter-spacing:.12em;cursor:pointer;
    transition:border-color .25s,color .25s,background .25s,box-shadow .25s;user-select:none;
    font-family:inherit;white-space:nowrap;}
  .pill:hover{border-color:rgba(143,189,240,.6);}
  .pill.on{color:#0d1420;background:var(--accent);border-color:var(--accent);
    box-shadow:0 0 24px rgba(143,189,240,.35);font-weight:600;}
  #powerBtn.on{color:#08222e;background:#7fe7ff;border-color:#7fe7ff;
    box-shadow:0 0 26px rgba(127,231,255,.4);}
  #macroBtn.on{color:#131007;background:#e8c98a;border-color:#e8c98a;
    box-shadow:0 0 26px rgba(232,201,138,.35);}
  #offBtn{padding:11px 16px;color:#ff9a8a;font-size:12px;}
  #offBtn:hover{border-color:rgba(255,122,106,.5);}
  /* 透视分段 */
  #xraySeg{display:flex;align-items:center;gap:2px;padding:5px 6px 5px 14px;border-radius:999px;
    background:var(--panel);border:1px solid var(--panel-border);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
  #xraySeg .lab{font-size:12px;letter-spacing:.1em;color:var(--ink-dim);margin-right:8px;}
  #xraySeg button{padding:6px 13px;border-radius:999px;border:none;background:transparent;
    color:var(--ink-dim);font-size:12px;cursor:pointer;font-family:inherit;letter-spacing:.04em;
    transition:background .2s,color .2s;}
  #xraySeg button:hover{color:var(--ink);}
  #xraySeg button.on{background:rgba(143,189,240,.22);color:var(--accent);font-weight:600;}
  /* 通电按钮：承载全部读出语义 */
  #powerBtn{letter-spacing:.03em;font-weight:600;}
  #powerBtn small{font-size:10.5px;font-weight:400;letter-spacing:.06em;color:inherit;opacity:.72;}
  /* 位线读出徽标 */
  .readout{position:fixed;left:0;top:0;z-index:7;pointer-events:none;display:none;
    flex-direction:column;align-items:center;justify-content:center;
    min-width:52px;padding:7px 10px 6px;border-radius:12px;will-change:transform,opacity;
    border:1px solid var(--panel-border);background:rgba(13,20,32,.72);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
  .readout .ro-d{font-size:26px;font-weight:800;line-height:1.05;}
  .readout .ro-c{font-size:10px;letter-spacing:.14em;color:var(--ink-dim);margin-top:2px;}
  .readout.r1{border-color:rgba(127,255,208,.55);box-shadow:0 0 24px rgba(127,255,208,.35);}
  .readout.r1 .ro-d{color:#7fffd0;text-shadow:0 0 14px rgba(127,255,208,.8);}
  .readout.r0{border-color:rgba(255,122,106,.55);box-shadow:0 0 24px rgba(255,122,106,.3);}
  .readout.r0 .ro-d{color:#ff7a6a;text-shadow:0 0 14px rgba(255,122,106,.8);}
  #pnote{font-size:11px;letter-spacing:.08em;color:rgba(127,231,255,.85);display:none;pointer-events:none;
    padding:5px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--panel-border);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
  #hint{position:fixed;bottom:34px;left:34px;z-index:10;font-size:11px;letter-spacing:.1em;color:rgba(157,180,204,.6);pointer-events:none;}
  /* 3D 标注（半透明） */
  .anno{position:fixed;left:0;top:0;z-index:6;pointer-events:none;
    padding:6px 10px;border-radius:8px;border:1px solid var(--panel-border);
    background:var(--panel);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
    white-space:nowrap;will-change:transform,opacity;}
  .anno .t{font-size:13px;font-weight:600;color:var(--ink);letter-spacing:.04em;line-height:1.3;}
  .anno .s{font-size:11px;color:var(--ink-dim);letter-spacing:.03em;line-height:1.35;margin-top:1px;}
  .anno.pw .t{color:#8ff0ff;}
  .anno.mc .t{color:#e8c98a;}
  /* 窄视口（正文嵌入 iframe）紧凑布局 */
  @media (max-width: 960px){
    #hdr{top:14px;left:16px;}
    #hdr h1{font-size:15px;}
    #hdr h1 .en{display:none;}
    #hdr p{margin-top:4px;font-size:11px;max-width:440px;}
    #caption{display:none;}
    #hint{display:none;}
    #ctrls{bottom:14px;gap:8px;}
    .pill{padding:8px 16px;font-size:12px;}
    #xraySeg{padding:4px 5px 4px 10px;}
    #xraySeg .lab{font-size:11px;margin-right:5px;}
    #xraySeg button{padding:5px 10px;font-size:11px;}
    .anno .t{font-size:12px;} .anno .s{font-size:10px;}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="vignette"></div>
<svg id="wires"></svg>
<div id="hdr">
  <h1>3D NAND 存储塔<span class="en">3D NAND Flash</span></h1>
  <p>字线层层堆叠 + 垂直沟道阵列：<b>容量不够，就向天空要</b></p>
</div>
<div id="caption">存储单元沿沟道孔垂直串联 · 字线逐层选通 —— <b>把存储阵列立起来</b></div>
<div id="hint">拖拽旋转 · 滚轮缩放 · 可转至正下方仰视</div>
<div id="ctrls">
  <div id="pnote">同一根沟道串着上百个单元 · 读哪层，哪层存没存电子就决定整串通不通 —— 这就是 NAND 的读</div>
  <div class="row">
    <button id="clipBtn" class="pill">剖切内部结构</button>
    <div id="xraySeg"><span class="lab">透视</span>
      <button data-v="0" class="on">关</button><button data-v="0.5">50%</button><button data-v="1">100%</button>
    </div>
    <button id="powerBtn" class="pill">⚡ 通电读出</button>
    <button id="offBtn" class="pill" style="display:none">断电</button>
    <button id="macroBtn" class="pill">宏观阵列</button>
  </div>
</div>
<div id="labels"></div>
<div id="readout" class="readout r0"><div class="ro-d">0</div><div class="ro-c">存有电子 · 整串断路</div></div>

<script src="../lib/three.min.js"></script>
<script>
(function(){
"use strict";
const Q = new URLSearchParams(location.search);
const AUTO = !Q.has('noauto');
THREE.ColorManagement.legacyMode = false; // 关键：材质颜色按 sRGB 正确解码

/* ---------- 渲染器 / 场景 ---------- */
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.localClippingEnabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1420);
scene.fog = new THREE.Fog(0x0d1420, 42, 85);
let fogNearT = 42, fogFarT = 85;

const camera = new THREE.PerspectiveCamera(36, innerWidth/Math.max(innerHeight,1)||1, 0.1, 240);

/* ---------- 程序化环境贴图（摄影棚灯带） ---------- */
function makeEnvTexture(){
  const w=1024, h=512, cv=document.createElement('canvas');
  cv.width=w; cv.height=h;
  const g=cv.getContext('2d');
  const grad=g.createLinearGradient(0,0,0,h);
  grad.addColorStop(0.00,'#4a5568');
  grad.addColorStop(0.32,'#2a3340');
  grad.addColorStop(0.55,'#1a212c');
  grad.addColorStop(1.00,'#070a0f');
  g.fillStyle=grad; g.fillRect(0,0,w,h);
  function band(y, hh, alpha){
    const bg=g.createLinearGradient(0,y-hh,0,y+hh);
    bg.addColorStop(0,'rgba(235,242,252,0)');
    bg.addColorStop(0.5,'rgba(235,242,252,'+alpha+')');
    bg.addColorStop(1,'rgba(235,242,252,0)');
    g.fillStyle=bg; g.fillRect(0,y-hh,w,hh*2);
  }
  band(h*0.14, h*0.075, 0.7);
  band(h*0.30, h*0.05, 0.32);
  const vb=g.createLinearGradient(w*0.52,0,w*0.66,0);
  vb.addColorStop(0,'rgba(225,236,248,0)');
  vb.addColorStop(0.5,'rgba(225,236,248,0.4)');
  vb.addColorStop(1,'rgba(225,236,248,0)');
  g.fillStyle=vb; g.fillRect(w*0.52,h*0.15,w*0.14,h*0.55);
  const vb2=g.createLinearGradient(w*0.02,0,w*0.12,0);
  vb2.addColorStop(0,'rgba(200,220,240,0)');
  vb2.addColorStop(0.5,'rgba(200,220,240,0.28)');
  vb2.addColorStop(1,'rgba(200,220,240,0)');
  g.fillStyle=vb2; g.fillRect(w*0.02,h*0.2,w*0.1,h*0.45);
  const sg=g.createRadialGradient(w*0.82,h*0.42,10, w*0.82,h*0.42,w*0.3);
  sg.addColorStop(0,'rgba(255,214,170,0.28)'); sg.addColorStop(1,'rgba(255,214,170,0)');
  g.fillStyle=sg; g.fillRect(0,0,w,h);
  const tex=new THREE.CanvasTexture(cv);
  tex.mapping=THREE.EquirectangularReflectionMapping;
  tex.encoding=THREE.sRGBEncoding;
  return tex;
}
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
scene.environment = pmrem.fromEquirectangular(makeEnvTexture()).texture;

/* ---------- 光照 ---------- */
scene.add(new THREE.HemisphereLight(0xb9c9dd, 0x141c28, 0.28));
const key = new THREE.DirectionalLight(0xfff1dc, 1.4);
key.position.set(9, 15, 7);
key.castShadow = true;
key.shadow.mapSize.set(4096, 4096);
key.shadow.camera.left=-22; key.shadow.camera.right=22;
key.shadow.camera.top=16;  key.shadow.camera.bottom=-12;
key.shadow.camera.near=2;  key.shadow.camera.far=60;
key.shadow.bias=-0.0012;
key.shadow.normalBias=0.03;
scene.add(key);
const rim = new THREE.DirectionalLight(0x7fa8ff, 1.0);
rim.position.set(-11, 6, -13);
scene.add(rim);
const fill = new THREE.DirectionalLight(0x9fb8d8, 0.22);
fill.position.set(-4, 3, 12);
scene.add(fill);

/* ---------- 阴影接收地面 ---------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(240, 240),
  new THREE.ShadowMaterial({opacity:0.45})
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.55;
ground.receiveShadow = true;
scene.add(ground);

/* ---------- 剖切平面（沿 Z 轴，从前方推入） ---------- */
const clipPlane = new THREE.Plane(new THREE.Vector3(0,0,-1), 6);
let clipT = 0, clipTarget = 0;
const CLIP_IN = 0.05;   // 剖面最终落在 z=0.05，切穿中间排沟道柱

/* ---------- 材质 ---------- */
const M = (c, m, r, env, extra) => {
  const mt = new THREE.MeshStandardMaterial(
    Object.assign({color:c, metalness:m, roughness:r, envMapIntensity:env,
      clippingPlanes:[clipPlane], clipShadows:true, side:THREE.DoubleSide}, extra||{}));
  mt.userData.baseMetal = m;
  if(mt.emissive) mt.userData.baseEmissive = mt.emissive.getHex();
  return mt;
};
const mat = {
  wl:       M(0xc09a5e, 0.90, 0.34, 1.00, {emissive:0x120d06}),   // 钨字线（栅极金）
  wlDummy:  M(0x8d7751, 0.85, 0.42, 0.70, {emissive:0x0c0906}),   // dummy 字线（暗金）
  sel:      M(0x7fa3c8, 0.70, 0.40, 0.80, {emissive:0x0a1420}),   // 选择管 SSL/GSL（钢蓝）
  wlSel:    M(0xf0be6a, 0.90, 0.28, 1.30, {emissive:0x8a4f10}),   // 通电：选中字线（亮琥珀）
  wlPass:   M(0xc09a5e, 0.90, 0.34, 1.00, {emissive:0x1c2a38}),   // 通电：其余字线 Vpass 微亮
  diel:     M(0x2e3842, 0.05, 0.95, 0.15, {emissive:0x0a0f14}),   // 层间介质（深色哑光，防断面过曝）
  slit:     M(0xb8c4d0, 0.10, 0.70, 0.40, {emissive:0x10151c}),   // 隔离缝绝缘填充（浅灰蓝）
  channel:  M(0x9fc8e8, 0.35, 0.35, 0.60, {emissive:0x12202e}),   // 多晶硅沟道（亮硅）
  ono:      M(0xf0a24f, 0.10, 0.30, 0.50, {transparent:true, opacity:0.50,
              emissive:0x2a1606}),                                // ONO 电荷俘获环（琥珀半透明）
  bitline:  M(0xdfe6ee, 0.85, 0.22, 1.45, {emissive:0x232a33}),   // 位线（亮银）
  contact:  M(0xcfd8e2, 0.85, 0.25, 1.30, {emissive:0x20262e}),   // 阶梯接触柱
  source:   M(0x6b7686, 0.50, 0.45, 0.40, {emissive:0x0d1218}),   // 源极板
  pedestal: M(0x111927, 0.45, 0.50, 0.30, {clippingPlanes:[]})
};

/* ---------- 圆角几何工具 ---------- */
function roundedRectShape(w, h, r){
  const s = new THREE.Shape(), x=-w/2, y=-h/2;
  s.moveTo(x+r, y);
  s.lineTo(x+w-r, y);        s.absarc(x+w-r, y+r,   r, -Math.PI/2, 0, false);
  s.lineTo(x+w, y+h-r);      s.absarc(x+w-r, y+h-r, r, 0, Math.PI/2, false);
  s.lineTo(x+r, y+h);        s.absarc(x+r,   y+h-r, r, Math.PI/2, Math.PI, false);
  s.lineTo(x, y+r);          s.absarc(x+r,   y+r,   r, Math.PI, Math.PI*1.5, false);
  return s;
}
function roundedBox(w, h, d, r, m){
  r = Math.min(r, w/2-0.001, h/2-0.001);
  const bev = Math.min(0.035, r*0.35);
  const geo = new THREE.ExtrudeGeometry(roundedRectShape(w, h, r), {
    depth: d - bev*2, bevelEnabled:true, bevelThickness:bev, bevelSize:bev,
    bevelSegments:2, curveSegments:14
  });
  geo.translate(0, 0, -(d - bev*2)/2);
  const ms = new THREE.Mesh(geo, m);
  ms.castShadow = true; ms.receiveShadow = true;
  return ms;
}
function box(w,h,d,m,x,y,z){
  const ms = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m);
  ms.position.set(x,y,z); ms.castShadow = true; ms.receiveShadow = true;
  return ms;
}
function cyl(rt, rb, h, m, x, y, z, open){
  const ms = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 28, 1, !!open), m);
  ms.position.set(x,y,z); ms.castShadow = true; ms.receiveShadow = true;
  return ms;
}
function anchor(parent, x,y,z){
  const o = new THREE.Object3D(); o.position.set(x,y,z); parent.add(o); return o;
}

/* ================================================================
   模型：3D NAND 存储塔（TCAT/BiCS 主流架构示意）
   层栈自底向上：GSL → dummy → 10 对有效字线 → dummy → SSL
   坐标：X 右（阶梯方向）/ Y 上 / Z 前（剖切从 +Z 推入）
================================================================ */
const model = new THREE.Group();
scene.add(model);

/* --- 层栈参数 --- */
const PAIRS   = 14;              // 14 对导电层 = 28 层（含选择管与 dummy）
const K_GSL   = 0;               // 底部选择管（源端）
const K_D1    = 1;               // 下 dummy
const K_WL0   = 2, K_WL1 = 11;   // 10 对有效字线
const K_D2    = 12;              // 上 dummy
const K_SSL   = 13;              // 顶部选择管（漏端）
const K_SEL   = 6;               // 通电演示时被选中的字线
const WL_H    = 0.18;            // 导电层厚
const DIEL_H  = 0.28;            // 介质层厚
const PITCH   = WL_H + DIEL_H;   // 0.46
const BASE_Y  = 0.25;            // 栈底（源极板顶 0.24 之上，错开防 z-fight）
const TOP_Y   = BASE_Y + PAIRS*PITCH;   // 6.69
const DECK_X0 = -3.5, DECK_X1 = 2.0;    // 主甲板 X 范围
const DECK_Z  = 2.5;                    // 主甲板 Z 半宽
const STEP_DX = 0.28;                   // 每层阶梯回缩

function layerMat(k){
  if(k === K_GSL || k === K_SSL) return mat.sel;
  if(k === K_D1  || k === K_D2)  return mat.wlDummy;
  return mat.wl;
}

/* --- 层栈 + 阶梯 --- */
// 第 k 层（0=底）导电层右缘延伸至 stairX(k)；介质层少伸 0.22，让台阶露头
function stairX(k){ return DECK_X1 + (PAIRS-1-k)*STEP_DX; }
const wlMeshes = [];  // 各导电层网格（按 k 索引，供通电高亮换材质）
for(let k=0; k<PAIRS; k++){
  const y0 = BASE_Y + k*PITCH;
  const sx = stairX(k);
  const wlW = sx - DECK_X0;
  const wl = roundedBox(wlW, WL_H, DECK_Z*2, 0.045, layerMat(k));
  wl.position.set(DECK_X0 + wlW/2, y0 + WL_H/2, 0);
  model.add(wl); wlMeshes[k] = wl;
  // 介质层：右缘比导电层短 0.22（露出台阶踏面）
  const dx1 = sx - 0.22;
  const dW = dx1 - DECK_X0;
  const dl = roundedBox(dW, DIEL_H, DECK_Z*2, 0.045, mat.diel);
  dl.position.set(DECK_X0 + dW/2, y0 + WL_H + DIEL_H/2, 0);
  model.add(dl);
  // 阶梯接触柱（立在露出的台阶上，连向译码电路）
  const ct = cyl(0.11, 0.11, 0.36, mat.contact, sx - 0.11, y0 + WL_H - 0.02 + 0.18, 1.1);
  model.add(ct);
}
// 顶盖介质
const cap = roundedBox(DECK_X1 - DECK_X0, DIEL_H, DECK_Z*2, 0.045, mat.diel);
cap.position.set((DECK_X0+DECK_X1)/2, TOP_Y + DIEL_H/2, 0);
model.add(cap);

/* --- 隔离缝 ×2（刻穿整个层栈，位于沟道排之间；兼作共源线通道） --- */
[0.8, -0.8].forEach(z=>{
  model.add(box(DECK_X1-DECK_X0, TOP_Y+DIEL_H-BASE_Y+0.01, 0.12, mat.slit,
    (DECK_X0+DECK_X1)/2, (BASE_Y+TOP_Y+DIEL_H)/2 + 0.005, z));
});

/* --- 沟道孔阵列 3×3 --- */
const CHAN_X = [-2.3, -0.5, 1.3];
const CHAN_Z = [-1.6, 0, 1.6];
CHAN_X.forEach(cx=>{
  CHAN_Z.forEach(cz=>{
    // 多晶硅沟道柱：y 0.1（嵌入源极板）→ 7.10（嵌入位线）

function makeFlowTexture(){
  const cv=document.createElement('canvas'); cv.width=cv.height=64;
  const g=cv.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)');
  gr.addColorStop(0.35,'rgba(190,242,255,0.85)');
  gr.addColorStop(1,'rgba(120,220,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(cv);
}

/* ================================================================
   宏观阵列：6×6 block + 每行位线 + 读出放大器（协同工作图）
================================================================ */
const macroGroup = new THREE.Group();
macroGroup.visible = false;
scene.add(macroGroup);
const ARR_N = 6, ARR_SX = 6.8, ARR_SZ = 5.6, ARR_CX = 0.6;
const blockCells = [];
for(let c=0; c<ARR_N; c++) for(let r=0; r<ARR_N; r++){
  const bx = (c-2.5)*ARR_SX + ARR_CX, bz = (r-2.5)*ARR_SZ;
  // 跳过与主塔重叠的 4 格（主塔即阵列中的一个 block）
  if((c===2||c===3) && (r===2||r===3)) continue;
  blockCells.push([bx, bz, c, r]);
}
let macroGlowMats = [];   // 随通电渐亮的材质（userData.off/on）
let macroReadMeshes = []; // 仅通电时可见的网格（沟道柱/夹断带/字线高亮）
let macroPts = null, macroParts = [], macroHalo = null;
const macroSheenMats = [];   // 读 1 位线的流动光泽材质（UV 滚动）
const AMP_X = 25.9;       // 读出放大器中心 X
{
  // 活跃 block（半透明、露内部）vs 非活跃 block（实心低细节）
  const activeCells   = blockCells.filter(b=>((b[2]*7+b[3]*11)%13)<6);
  const inactiveCells = blockCells.filter(b=>activeCells.indexOf(b)<0);
  const blockGeo = new THREE.BoxGeometry(5.2, 6.8, 4.7);
  const blockMat = new THREE.MeshStandardMaterial({color:0x2c3644, metalness:0.15,
    roughness:0.8, envMapIntensity:0.3, emissive:0x080d14});
  const blocks = new THREE.InstancedMesh(blockGeo, blockMat, inactiveCells.length);
  const actMat = new THREE.MeshStandardMaterial({color:0x3a4a5c, metalness:0.15,
    roughness:0.6, envMapIntensity:0.4, emissive:0x0a1220,
    transparent:true, opacity:0.30, depthWrite:false});
  const actBlocks = new THREE.InstancedMesh(blockGeo, actMat, activeCells.length);
  const stripeGeo = new THREE.BoxGeometry(5.24, 0.5, 4.74);
  const stripeMat = new THREE.MeshStandardMaterial({color:0x9a8254, metalness:0.8,
    roughness:0.4, envMapIntensity:0.7, emissive:0x0e0a05});
  const stripes = new THREE.InstancedMesh(stripeGeo, stripeMat, blockCells.length);
  const m4 = new THREE.Matrix4();
  inactiveCells.forEach((b,i)=>{ m4.makeTranslation(b[0], 3.35, b[1]); blocks.setMatrixAt(i, m4); });
  activeCells.forEach((b,i)=>{ m4.makeTranslation(b[0], 3.35, b[1]); actBlocks.setMatrixAt(i, m4); });
  blockCells.forEach((b,i)=>{ m4.makeTranslation(b[0], 4.2, b[1]);  stripes.setMatrixAt(i, m4); });
  blocks.castShadow = blocks.receiveShadow = true;
  stripes.castShadow = true;
  macroGroup.add(blocks, actBlocks, stripes);
  // ===== 阵列协同读出：每行一条位线汇入读出端，行读出态 1=绿 / 0=红 =====
  const ROW_STATE = r => (r % 2 === 0) ? '1' : '0';
  const conducting = activeCells.filter(b=>ROW_STATE(b[3])==='1');
  const blockedC   = activeCells.filter(b=>ROW_STATE(b[3])==='0');
  const gm = (color, off, on, extra)=>{
    const m = new THREE.MeshBasicMaterial(Object.assign({color, transparent:true,
      opacity:off, blending:THREE.AdditiveBlending, depthWrite:false}, extra||{}));
    m.userData.off = off; m.userData.on = on; macroGlowMats.push(m); return m;
  };
  // 沟道柱（活跃串可见内部）：导通=整柱青辉光；阻断=下段微亮 + 选中层红色夹断带 + 上段转暗
  const chanOnMesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.26,0.26,6.5,16), gm(0x7fe7ff,0,0.40), conducting.length);
  conducting.forEach((b,i)=>{ m4.makeTranslation(b[0], 3.20, b[1]); chanOnMesh.setMatrixAt(i, m4); });
  const chanLowMesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.26,0.26,2.7,16), gm(0x7fe7ff,0,0.30), blockedC.length);
  blockedC.forEach((b,i)=>{ m4.makeTranslation(b[0], 1.30, b[1]); chanLowMesh.setMatrixAt(i, m4); });
  const chanDarkMesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.26,0.26,3.3,16), gm(0x0a0f16,0,0.55,{blending:THREE.NormalBlending}), blockedC.length);
  blockedC.forEach((b,i)=>{ m4.makeTranslation(b[0], 4.95, b[1]); chanDarkMesh.setMatrixAt(i, m4); });
  const pinchMesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.30,0.30,0.42,16), gm(0xff5a4a,0,0.70), blockedC.length);
  blockedC.forEach((b,i)=>{ m4.makeTranslation(b[0], 3.05, b[1]); pinchMesh.setMatrixAt(i, m4); });
  // 选中行字线：所有活跃 block 同层同步高亮（同一字线并行选中一整页）+ 列向连线
  const wlSlabMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(5.24,0.16,4.74), gm(0xf0be6a,0,0.38), activeCells.length);
  activeCells.forEach((b,i)=>{ m4.makeTranslation(b[0], 3.05, b[1]); wlSlabMesh.setMatrixAt(i, m4); });
  const wlLinkMat = gm(0xf0be6a, 0, 0.50);
  for(let c=0;c<ARR_N;c++){
    const col = activeCells.filter(b=>b[2]===c);
    if(col.length<2) continue;
    const zs = col.map(b=>b[1]);
    const z0=Math.min.apply(null,zs), z1=Math.max.apply(null,zs);
    macroGroup.add(box(0.34, 0.10, z1-z0, wlLinkMat, col[0][0], 3.05, (z0+z1)/2));
  }
  [chanOnMesh,chanLowMesh,chanDarkMesh,pinchMesh,wlSlabMesh].forEach(m=>{ m.visible=false; macroGroup.add(m); });
  macroReadMeshes = [chanOnMesh,chanLowMesh,chanDarkMesh,pinchMesh,wlSlabMesh];
  // 位线：每行一条，左端越过最左 block 再渐隐延伸（不悬空），右端直抵读出放大器盒壁
  const ARR_X0 = -2.5*ARR_SX + ARR_CX - 2.6 - 2.6;   // -21.6：最左 block 左缘再外伸
  const sheenTex = (()=>{   // 读 1 位线的流动光泽纹理（亮脉冲沿 +X 滚动）
    const cv = document.createElement('canvas'); cv.width = 128; cv.height = 8;

    const gr = g.createLinearGradient(0, 0, 128, 0);
    gr.addColorStop(0.00,'rgba(255,255,255,0)');

    gr.addColorStop(0.50,'rgba(255,255,255,0.9)');

    gr.addColorStop(1.00,'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 8);
    const tx = new THREE.CanvasTexture(cv);
    tx.wrapS = THREE.RepeatWrapping; tx.repeat.x = 6;
    return tx;
  })();
  for(let r=0; r<ARR_N; r++){
    const cells = activeCells.filter(b=>b[3]===r);
    if(!cells.length) continue;
    const wz = (r-2.5)*ARR_SZ;
    const col = ROW_STATE(r)==='1' ? 0x7fffd0 : 0xff6a5a;
    const len = (AMP_X-1.6) - ARR_X0;
    macroGroup.add(box(len, 0.14, 0.30, gm(col, 0.10, 0.85), ARR_X0+len/2, 7.0, wz));
    // 左端渐隐延伸段 ×3（越过阵列物理左缘，示意位线排继续延伸）
    [[ARR_X0-0.9, 0.06, 0.50],[ARR_X0-1.7, 0.03, 0.25],[ARR_X0-2.5, 0.015, 0.10]]
      .forEach(([fx, off, on])=>{
        macroGroup.add(box(0.8, 0.14, 0.30, gm(col, off, on), fx, 7.0, wz));
      });
    // 读 1 行：整条位线叠加流动光泽（UV 滚动亮脉冲）；读 0 行保持暗红静止
    if(ROW_STATE(r)==='1'){
      const sm = new THREE.MeshBasicMaterial({map:sheenTex.clone(), color:0x9fffe0,
        transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false});
      sm.map.repeat.x = 6; sm.userData.off = 0; sm.userData.on = 0.55;
      macroGlowMats.push(sm); macroSheenMats.push(sm);
      const sh = box(len, 0.02, 0.34, sm, ARR_X0+len/2, 7.10, wz);
      sh.castShadow = sh.receiveShadow = false;
      macroGroup.add(sh);
    }
  }
  // 读出放大器 · 页缓冲（阵列 +X 端半透明盒 + 每行端子灯）
  const amp = new THREE.Mesh(new THREE.BoxGeometry(3, 7.4, 30.5),
    new THREE.MeshStandardMaterial({color:0x39506a, metalness:0.3, roughness:0.4,
      transparent:true, opacity:0.34, emissive:0x14243a, depthWrite:false}));
  amp.position.set(AMP_X, 3.4, 0); macroGroup.add(amp);
  const ampEdge = new THREE.LineSegments(new THREE.EdgesGeometry(amp.geometry),
    new THREE.LineBasicMaterial({color:0x8fb4dd, transparent:true, opacity:0.75}));
  ampEdge.position.copy(amp.position); macroGroup.add(ampEdge);
  for(let r=0; r<ARR_N; r++){
    const wz=(r-2.5)*ARR_SZ;
    const lamp = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.55,0.55),
      gm(ROW_STATE(r)==='1'?0x7fffd0:0xff6a5a, 0.30, 1.0));
    lamp.position.set(AMP_X-1.7, 7.0, wz); macroGroup.add(lamp);
  }
  // 静态字线走线（下层金属示意；调暗以免与位线混淆）
  const wireWL = new THREE.MeshStandardMaterial({color:0x54616f, metalness:0.6, roughness:0.5,
    envMapIntensity:0.25, emissive:0x0a0e14, transparent:true, opacity:0.5});
  [-16.4, -9.6, 10.8, 17.6].forEach(wx=>{
    macroGroup.add(box(0.22, 0.07, 31, wireWL, wx, 6.78, 0));
  });
  // 宏观粒子：每活跃串 7 颗；导通串到顶后沿位线横向汇入读出端，阻断串在选中层下堆积闪烁
  const MP_PER = 7;
  activeCells.forEach(b=>{
    const L1 = 6.65, L2 = (AMP_X-1.7) - b[0], L = L1+L2;
    for(let k=0;k<MP_PER;k++) macroParts.push({bx:b[0], bz:b[1], st:ROW_STATE(b[3]),
      L:L, f1:L1/L, t:Math.random(), maxT:(2.55/L)*(0.95+Math.random()*0.05),
      base:new THREE.Color(ROW_STATE(b[3])==='1'?0x7fffd0:0xff6a5a), ph:Math.random()*6.28});
  });
  // 导通位线上的"念珠流"：每条绿线 10 颗沿整条位线匀速流动（任何时刻肉眼可见一串亮点）
  for(let r=0;r<ARR_N;r++){
    if(ROW_STATE(r)!=='1') continue;
    const wz=(r-2.5)*ARR_SZ;
    for(let k=0;k<10;k++) macroParts.push({runner:true, bz:wz, st:'1',
      t:k/10, base:new THREE.Color(0x8fffd8), ph:Math.random()*6.28});
  }
  const mpGeo = new THREE.BufferGeometry();
  const mpPos = new Float32Array(macroParts.length*3);
  const mpCol = new Float32Array(macroParts.length*3);
  macroParts.forEach((p,i)=>{
    mpCol[i*3]=p.base.r; mpCol[i*3+1]=p.base.g; mpCol[i*3+2]=p.base.b;
  });
  mpGeo.setAttribute('position', new THREE.BufferAttribute(mpPos, 3));
  mpGeo.setAttribute('color', new THREE.BufferAttribute(mpCol, 3));
  macroPts = new THREE.Points(mpGeo, new THREE.PointsMaterial({size:0.55, map:flowTex,
    vertexColors:true, transparent:true, opacity:1.0, blending:THREE.AdditiveBlending,
    depthWrite:false, sizeAttenuation:true}));
  macroPts.visible = false; macroPts.frustumCulled = false;
  macroGroup.add(macroPts);
  // 同位光晕点（共享几何与顶点色）：更大更淡，提供辉光
  macroHalo = new THREE.Points(mpGeo, new THREE.PointsMaterial({size:1.25, map:flowTex,
    vertexColors:true, transparent:true, opacity:0.20, blending:THREE.AdditiveBlending,
    depthWrite:false, sizeAttenuation:true}));
  macroHalo.visible = false; macroHalo.frustumCulled = false;
  macroGroup.add(macroHalo);
}

/* ---------- 通电：电子流（源极板 → 沟道向上 → 位线） ---------- */
// 中排中柱 (-0.5, 0)：源极 → 柱顶 → 折向位线 +X
// 注意：粒子与箭头材质【不挂剖切平面】，剖切态下电流路径仍可见
const FLOW_PATH = [[-0.5, 0.5, 0], [-0.5, 7.0, 0], [6.5, BL_Y, 0]];   // 到顶后沿位线奔向读出端方向
function pathPoint(p, t, out){

const v3 = new THREE.Vector3();
const cd = new THREE.Vector3();
const effP = new THREE.Vector3();
const wPos = new THREE.Vector3();
const MODEL_CY = 3.4;  // 模型包围盒中心高度
function projectWorld(w){
  v3.copy(w).project(camera);
  return {x:(v3.x*0.5+0.5)*innerWidth, y:(-v3.y*0.5+0.5)*innerHeight, behind: v3.z > 1};
}
// cy：部件自身中心高度（避免低/高处锚点法线被 y 分量带偏）
// clamped：锚点已被收回到剖面 → 法线取剖面法线 (+Z)
function facingOpacity(w, cy, clamped){
  cd.copy(camera.position).sub(w);
  let nx, ny, nz;
  if(clamped){ nx = 0; ny = 0; nz = 1; }
  else {
    nx = w.x - 0.6; ny = w.y - (cy !== undefined ? cy : MODEL_CY); nz = w.z;
  }
  const nl = Math.hypot(nx,ny,nz) || 1;
  const dot = (nx*cd.x + ny*cd.y + nz*cd.z) / (nl * (cd.length()||1));
  return dot < 0.04 ? 0.3 : 1;
}
function updateLabels(){
  wires.setAttribute('viewBox','0 0 '+innerWidth+' '+innerHeight);
  // 当前剖面在模型局部 Z 坐标中的位置（与 clipPlane 动画同一公式）
  const cutZ = 6 + (CLIP_IN-6)*clipT;
  annos.forEach(a=>{
    // 专属标注可见性：通电专属 / 宏观专属（可叠加）/ 宏观模式下隐藏普通标注
    const modeHidden = a.macroOnly
      ? (!macroOn || (a.powerOnly && !powerOn))
      : (macroOn || (a.powerOnly && !powerOn));
    // 剖面跟随：锚点位于被裁侧（z > cutZ）→ 收回到剖切平面上
    effP.copy(a.base);
    const clamped = effP.z > cutZ;
    if(clamped) effP.z = cutZ;
    wPos.copy(effP);
    model.localToWorld(wPos);
    const p = projectWorld(wPos);
    let lx = p.x + a.dx, ly = p.y + a.dy;
    lx = Math.max(92, Math.min(innerWidth-92, lx));
    ly = Math.max(a.minY, Math.min(innerHeight-70, ly));
    const offscreen = modeHidden || p.behind || p.x<-60 || p.x>innerWidth+60 || p.y<-60 || p.y>innerHeight+60;
    if(offscreen){ a.el.style.display='none'; a.line.style.display='none';
      a.dot.style.display='none'; a.halo.style.display='none'; return; }
    // 部件整体被切穿 → 标注淡出隐藏（不指向空处）
    let clipOp = 1;
    if(cutZ <= a.range[0]) clipOp = 0;
    else if(cutZ < a.range[0]+0.35) clipOp = (cutZ - a.range[0])/0.35;
    // 背面淡化 × 剖切淡化（平滑过渡）
    const toOp = facingOpacity(wPos, a.cy, clamped) * clipOp;
    a.op += (toOp - a.op) * 0.18;
    if(a.op < 0.02){ a.el.style.display='none'; a.line.style.display='none';
      a.dot.style.display='none'; a.halo.style.display='none'; return; }
    a.el.style.display='block'; a.line.style.display='';
    a.dot.style.display=''; a.halo.style.display='';
    a.el.style.opacity = a.op;
    a.line.style.opacity = a.op; a.dot.style.opacity = a.op; a.halo.style.opacity = a.op;
    a.el.style.transform = 'translate('+(lx)+'px,'+(ly)+'px) translate(-50%,-50%)';
    const ex = lx - Math.sign(a.dx)*Math.min(Math.abs(a.dx)*0.55, 46);
    const ey = ly - Math.sign(a.dy)*Math.min(Math.abs(a.dy)*0.5, 22);
    a.line.setAttribute('x1',p.x); a.line.setAttribute('y1',p.y);
    a.line.setAttribute('x2',ex);  a.line.setAttribute('y2',ey);
    a.dot.setAttribute('cx',p.x);  a.dot.setAttribute('cy',p.y);
    a.halo.setAttribute('cx',p.x); a.halo.setAttribute('cy',p.y);
  });

    }
  }
}

/* ---------- 主循环 ---------- */
const clock = new THREE.Clock();
function easeInOut(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
let clipAnim = null;
let _fpsFrames = 0, _fpsTime = 0, _fpsVal = 0;
function animate(){
  requestAnimationFrame(animate);
  if(innerWidth < 2 || innerHeight < 2) return; // 0×0 视口（隐藏章节下的懒加载 iframe）守卫
  const dt = Math.min(clock.getDelta(), 0.05);
  _fpsFrames++; _fpsTime += dt;
  if(_fpsTime >= 1){ _fpsVal = _fpsFrames/_fpsTime; _fpsFrames = 0; _fpsTime = 0; }
  if(autoRot) tTheta += dt * (Math.PI*2/8);
  theta += (tTheta - theta) * 0.075;
  phi   += (tPhi   - phi)   * 0.075;
  // 相机过渡（900ms 平滑，不瞬移）
  if(camAnim){
    camAnim.t += dt/0.9;
    const e = easeInOut(Math.min(camAnim.t, 1));
    target.lerpVectors(camAnim.fromT, camAnim.toT, e);
    radius = camAnim.fromR + (camAnim.toR - camAnim.fromR)*e;
    if(camAnim.t >= 1) camAnim = null;
  } else {
    radius += (tRadius - radius) * 0.075;
  }
  scene.fog.near += (fogNearT - scene.fog.near) * 0.075;
  scene.fog.far  += (fogFarT  - scene.fog.far)  * 0.075;
  camera.position.set(
    target.x + radius*Math.sin(phi)*Math.sin(theta),
    target.y + radius*Math.cos(phi),
    target.z + radius*Math.sin(phi)*Math.cos(theta)
  );
  camera.lookAt(target);
  if(clipT !== clipTarget){
    if(!clipAnim) clipAnim = {from:clipT, to:clipTarget, t:0};
    clipAnim.t += dt/0.6;
    if(clipAnim.t >= 1){ clipT = clipAnim.to; clipAnim = null; }
    else clipT = clipAnim.from + (clipAnim.to-clipAnim.from)*easeInOut(Math.min(clipAnim.t,1));
    clipPlane.constant = 6 + (CLIP_IN-6)*clipT;
  }
  // 选中层特写渐变（导通辉光 / 夹断红斑 + 被困电子）
  bandT1 += ((powerOn && cellState==='1' ? 1:0) - bandT1) * 0.12;
  bandT0 += ((powerOn && cellState==='0' ? 1:0) - bandT0) * 0.12;
  conductBand.visible = bandT1 > 0.02;
  conductBand.material.opacity = 0.50 * bandT1;
  pinchBand.visible = bandT0 > 0.02;
  pinchBand.material.opacity = 0.60 * bandT0;
  trapDots.visible = bandT0 > 0.02;
  trapDots.material.opacity = 0.95 * bandT0;
  // 宏观阵列：发光材质随通电渐亮 + 各串粒子（垂直上升 → 到顶沿位线横向汇入读出端）
  macroGlowT += ((powerOn?1:0) - macroGlowT) * 0.1;
  macroGlowMats.forEach(m=>{ m.opacity = m.userData.off + (m.userData.on-m.userData.off)*macroGlowT; });
  updateMacroFlow(dt);
  updateFlow(dt);
  renderer.render(scene, camera);
  updateLabels();
}
animate();

addEventListener('resize', ()=>{
  if(innerWidth < 2 || innerHeight < 2) return;
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  const f = fitR();
  if(Math.abs(f - lastFit) > 0.01){ tRadius = tRadius/lastFit*f; radius = radius/lastFit*f; lastFit = f; }
});

/* ---------- 调试钩子（供自动化验收） ---------- */
window.__dbg = {
  view:(th,ph,r)=>{ tTheta=theta=th; tPhi=phi=ph; tRadius=radius=r; autoRot=false; camAnim=null; },
  viewAt:(th,ph,r,tx,ty,tz)=>{ tTheta=theta=th; tPhi=phi=ph; tRadius=radius=r;
    autoRot=false; camAnim=null; target.set(tx,ty,tz); },
  clip:(v)=>{ clipTarget=v; clipT=v; clipAnim=null;
    clipPlane.constant = 6 + (CLIP_IN-6)*v; },
  xray:(v)=>setXray(v),
  power:(b)=>setPower(!!b),
  macro:(b)=>setMacro(!!b),
  cell:(v)=>setCell(v),
  fps:()=>_fpsVal,
  macroFlow:()=>{ if(!macroPts) return [];
    const a = macroPts.geometry.attributes.position.array;
    return Array.from(a.slice(0, 18)).map(v=>+v.toFixed(2)); },
  flow:()=>Array.from(flowGeo.attributes.position.array).map(v=>+v.toFixed(3)),
  sheenOff:()=>macroSheenMats.length ? macroSheenMats[0].map.offset.x : null,
  state:()=>({theta, phi, radius, clipT, powerOn, macroOn, cellState}),
  pick:(sx,sy)=>{ const nd=new THREE.Vector2(sx/innerWidth*2-1, -(sy/innerHeight)*2+1);
    const rc=new THREE.Raycaster(); rc.setFromCamera(nd,camera);
    const hits=rc.intersectObjects(scene.children,true);
    return hits.slice(0,4).map(h=>({d:+h.distance.toFixed(2), geo:h.object.geometry.type,
      col:h.object.material&&h.object.material.color?h.object.material.color.getHexString():null,
      pos:h.object.getWorldPosition(new THREE.Vector3()).toArray().map(v=>+v.toFixed(2))})); }
};
})();
</script>
